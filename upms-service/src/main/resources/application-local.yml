spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auth_center?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: root
    
  # MyBatis Plus配置
  mybatis-plus:
    mapper-locations: classpath*:/mapper/*.xml
    type-aliases-package: com.auth.center.role.domain.entity
    configuration:
      map-underscore-to-camel-case: true
      cache-enabled: false
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    
logging:
  level:
    com.auth.center.role.infrastructure.repository: debug