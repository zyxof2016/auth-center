server:
  port: 8080

spring:
  application:
    name: auth-gateway
  
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
    
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      routes:
        - id: auth-server
          uri: lb://auth-server
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        
        - id: role-service
          uri: lb://role-service
          predicates:
            - Path=/api/role/**
          filters:
            - StripPrefix=1

# Sentinel配置
sentinel:
  transport:
    dashboard: localhost:8081
  eager: true

# 日志配置
logging:
  level:
    com.auth.center.gateway: debug
    org.springframework.cloud.gateway: debug